name: Auto Deploy ChatFlyr to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to AWS EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 15.252.121.132
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            rm -f /home/ubuntu/package-lock.json /home/ubuntu/Saas-whtsapp-CRM/package-lock.json
            if [ -d "/home/ubuntu/Saas-whtsapp-CRM/wacrm" ]; then
              cd /home/ubuntu/Saas-whtsapp-CRM/wacrm
            elif [ -d "/home/ubuntu/Saas-whtsapp-CRM" ]; then
              cd /home/ubuntu/Saas-whtsapp-CRM
            fi
            git pull origin main
            npm install --legacy-peer-deps
            NODE_OPTIONS="--max-old-space-size=2048" npm run build
            pm2 delete chatflyr || true
            pm2 start ecosystem.config.js
            pm2 save
            sudo systemctl restart nginx
