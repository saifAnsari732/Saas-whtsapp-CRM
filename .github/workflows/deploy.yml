name: Auto Deploy ChatFlyr to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to AWS EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 15.252.121.132
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/Saas-whtsapp-CRM
            git pull origin main
            npm install
            NODE_OPTIONS="--max-old-space-size=2048" npm run build
            pm2 restart chatflyr || pm2 start npm --name "chatflyr" -- start
            pm2 save
            sudo systemctl restart nginx
