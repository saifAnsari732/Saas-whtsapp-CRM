name: Auto Deploy ChatFlyr to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to AWS EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: chatflyr.kisandigital.org
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            [ -s "$HOME/.bashrc" ] && source "$HOME/.bashrc"
            export PATH=$PATH:/usr/local/bin:/usr/bin:~/.nvm/versions/node/$(ls ~/.nvm/versions/node 2>/dev/null | tail -n 1)/bin

            if [ -f "/home/ubuntu/Saas-whtsapp-CRM/package.json" ]; then
              cd /home/ubuntu/Saas-whtsapp-CRM
            elif [ -f "/home/ubuntu/Saas-whtsapp-CRM/wacrm/package.json" ]; then
              cd /home/ubuntu/Saas-whtsapp-CRM/wacrm
            fi

            echo "=== Deployment Working Directory: $(pwd) ==="
            which node || echo "node not in PATH"
            node -v || true
            which pm2 || echo "pm2 not in PATH"

            git fetch origin main
            git reset --hard origin/main
            git log -1 --oneline

            npm install --legacy-peer-deps
            NODE_OPTIONS="--max-old-space-size=2048" npm run build

            # Restart PM2 process cleanly
            pm2 delete chatflyr || true
            pm2 start ecosystem.config.js --cwd $(pwd)
            pm2 save

            sudo systemctl restart nginx

            sleep 5
            pm2 status
            curl -I http://127.0.0.1:3000 || pm2 logs chatflyr --lines 40 --nostream
